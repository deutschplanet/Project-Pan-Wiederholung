<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Project-Pan-Auktion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: auction-house catalogue — rule card first, then two bidder paddles and twelve numbered lots; a bidding desk opens over the chosen lot */
:root{
  /* DeutschPlanet palette (same as Satz-Auktion): #FFE8E8 · #BF94CC · #FDE4C2 · #FFFFFF · #D3C4E8 · #B39DDB · #A04BAF */
  --bg:#FDE4C2; --surface:#FFFFFF; --ink:#3a2340; --muted:#76607c; --line:#D3C4E8;
  --brass:#A04BAF; --brass-soft:#FFE8E8;
  --teamA:#6a4fae; --teamA-soft:#D3C4E8; --teamB:#8f3f9d; --teamB-soft:#efdcf3;
  --ok:#2e7d55; --ok-soft:#e1f3e8; --bad:#b03a4a; --bad-soft:#ffe1e4;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --poster:"Bebas Neue", Impact, "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1422; --surface:#2a1d30; --ink:#f8eef8; --muted:#bfa9c6; --line:#4a3854;
  --brass:#d9a6e3; --brass-soft:#4a3550;
  --teamA:#B39DDB; --teamA-soft:#352b4f; --teamB:#BF94CC; --teamB-soft:#432b4b;
  --ok:#7fd3a3; --ok-soft:#1d3a2b; --bad:#f29aa6; --bad-soft:#47222a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1422; --surface:#2a1d30; --ink:#f8eef8; --muted:#bfa9c6; --line:#4a3854;
  --brass:#d9a6e3; --brass-soft:#4a3550;
  --teamA:#B39DDB; --teamA-soft:#352b4f; --teamB:#BF94CC; --teamB-soft:#432b4b;
  --ok:#7fd3a3; --ok-soft:#1d3a2b; --bad:#f29aa6; --bad-soft:#47222a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h1{font-family:var(--poster);font-size:clamp(3rem,9vw,4.8rem);letter-spacing:.03em;line-height:.95}
h2{font-size:1.6rem}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1.1em}
button:hover:not(:disabled){border-color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.primary:hover:not(:disabled){background:var(--brass);border-color:var(--brass);color:var(--surface)}
input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:.55em .8em;width:100%}

/* header */
.masthead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:16px}
.mh-text{display:grid;gap:8px;min-width:0;flex:1 1 300px}
.logo{width:150px;height:auto;max-width:100%;margin-bottom:4px}
.masthead .sub{color:var(--muted);max-width:44ch}
.mh-art{position:relative;flex:0 1 360px;height:200px;max-width:100%}
.mh-art .note{position:absolute;left:0;bottom:8px;width:min(230px,62%);height:auto;transform:rotate(-9deg);filter:drop-shadow(0 6px 10px rgba(58,35,64,.25));animation:float 5s ease-in-out infinite}
.mh-art .gavel{position:absolute;right:0;top:0;width:min(200px,56%);height:auto;transform-origin:96% 78%;animation:bang 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-6px)}}
@keyframes bang{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(9deg)}92%{transform:rotate(-2deg)}}
@media (max-width:640px){.mh-art{flex-basis:100%;height:170px;max-width:340px;margin-inline:auto}}

/* rule card */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:14px;align-content:start;min-width:0}
.rulecard{border:2px solid var(--ink)}
.rulecard .lead{color:var(--muted);max-width:62ch}
.rt{width:100%;border-collapse:collapse}
.rt th{text-align:left;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 12px 8px;border-bottom:2px solid var(--ink)}
.rt th:first-child,.rt td:first-child{padding-left:0}
.rt td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.rt tr:last-child td{border-bottom:0}
.rt .kon{font-family:var(--display);font-size:1.3rem;color:var(--brass);white-space:nowrap;line-height:1.2}
.rt .kon small{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.rt .bau{color:var(--muted);font-size:.93rem;width:30%}
.rt .bau strong{color:var(--ink);display:block}
.rt .bsp{font-size:1.04rem;line-height:1.7}
.k{background:var(--brass-soft);color:var(--ink);font-weight:700;padding:.05em .25em;border-radius:4px}
.v{font-weight:700;text-decoration:underline;text-decoration-color:var(--teamA);text-decoration-thickness:3px;text-underline-offset:5px}
.n{text-decoration:underline dashed;text-decoration-color:var(--teamB);text-decoration-thickness:2px;text-underline-offset:5px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--muted);align-items:center}
.note-line{font-size:.93rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
.note-line strong{color:var(--ink)}
@media (max-width:640px){
  .rt thead{display:none}
  .rt tr{display:grid;gap:4px;padding:14px 0;border-bottom:1px solid var(--line)}
  .rt tr:last-child{border-bottom:0}
  .rt td,.rt .bau{padding:0;border:0;width:auto}
  .rt .kon{white-space:normal}
}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.steps li{display:flex}
.steps button{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--muted);padding:.3em .95em .3em .35em;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.steps button:hover{color:var(--ink)}
.steps li.now button{border-color:var(--ink);color:var(--ink);cursor:default}
.steps .sn{display:grid;place-items:center;width:1.75em;height:1.75em;border-radius:50%;background:var(--bg);font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.steps li.now{border-color:var(--ink);color:var(--ink)}
.steps li.now .sn{background:var(--ink);color:var(--surface)}
.steps button:hover .sn{background:var(--brass-soft);color:var(--brass)}
.steps li.now button:hover .sn{background:var(--ink);color:var(--surface)}

/* prep */
.prep{display:grid;gap:24px}
.startbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;align-items:end}
@media (max-width:640px){.startbar{grid-template-columns:1fr}}
@media (max-width:760px){.prep{grid-template-columns:1fr}}
.rules{padding-left:1.2em;margin:0;column-gap:44px}
.rules li{break-inside:avoid;margin-bottom:10px}
@media (min-width:761px){.rules{column-count:2}}
.rules li::marker{color:var(--brass);font-weight:700}
.preview-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.preview-list li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px;align-items:baseline}
.lotno{font-family:var(--mono);color:var(--brass);font-weight:700;font-size:.9rem;white-space:nowrap}
.teamfield{display:grid;gap:6px}
.teamfield label{font-weight:700;font-size:.9rem}
.dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;margin-right:.4em;vertical-align:0}

/* cheat sheet during play */
.cheat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.cheat summary{cursor:pointer;font-weight:700;color:var(--brass);list-style-position:inside}
.cheat[open]{padding-bottom:18px}
.cheat[open] summary{margin-bottom:10px}

/* paddles */
.paddles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.paddle{border-radius:16px;padding:16px 18px;border:2px solid transparent;background:var(--surface);display:grid;gap:4px;transition:transform .2s,border-color .2s;min-width:0}
.paddle .name{font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.paddle .money{font-size:clamp(1.6rem,5vw,2.3rem)}
.paddle .turn{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;min-height:1.2em}
.paddle.A{--c:var(--teamA);--cs:var(--teamA-soft)} .paddle.B{--c:var(--teamB);--cs:var(--teamB-soft)}
.paddle .money,.paddle .turn{color:var(--c)}
.paddle.active{border-color:var(--c);background:var(--cs);transform:translateY(-2px)}

/* lots */
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lot{text-align:left;display:grid;gap:8px;padding:16px;border-radius:14px;background:var(--surface);position:relative;min-height:118px;align-content:start;min-width:0}
.lot .lotno{font-size:.82rem}
.lot .s{font-size:1.02rem}
.lot.sold{cursor:default;background:var(--bg);border:1.5px dashed var(--line)}
.stamp{justify-self:start;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.2em .6em;border-radius:6px;border:1.5px solid currentColor}
.stamp.win{color:var(--ok)} .stamp.lose{color:var(--bad)}
.solution mark,.lot mark{background:var(--brass-soft);color:var(--ink);padding:0 .15em;border-radius:4px}

/* desk */
.desk{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:22px;display:grid;gap:18px}
.desk .bigs{font-family:var(--display);font-size:clamp(1.3rem,3.6vw,1.9rem);line-height:1.35}
.stack{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.choice{flex:1 1 160px;padding:.9em;font-weight:700;font-size:1.05rem}
.choice[aria-pressed="true"].yes{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choice[aria-pressed="true"].no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.betrow{display:grid;grid-template-columns:minmax(0,1fr) 7.5em;gap:12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--brass)}
.chips button{padding:.35em .8em;font-family:var(--mono);font-size:.9rem}
.verdict{border-radius:14px;padding:16px 18px;display:grid;gap:8px}
.verdict.win{background:var(--ok-soft)} .verdict.lose{background:var(--bad-soft)}
.verdict h3{font-size:1.5rem}
.verdict.win h3{color:var(--ok)} .verdict.lose h3{color:var(--bad)}
.solution{font-family:var(--display);font-size:1.15rem;line-height:1.45}
.tag{justify-self:start;font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.25em .7em;border-radius:999px;background:var(--brass-soft);color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.toolbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center}
#accept[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);font-weight:700}
#reject[aria-pressed="true"]{border-color:var(--bad);color:var(--bad);font-weight:700}

/* finale */
.finale{display:grid;place-items:center;padding-block:12px}
.card{position:relative;width:min(560px,100%);background:var(--surface);border-radius:22px;padding:34px 26px;text-align:center;display:grid;gap:16px;border:2px solid var(--brass);box-shadow:0 0 0 8px var(--brass-soft);overflow:hidden;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.card .msg{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.4rem);color:var(--brass);line-height:1.1}
.card .stars{font-size:2rem;letter-spacing:.3em}
.card .stars span{display:inline-block;animation:twinkle 1.6s ease-in-out infinite}
.card .stars span:nth-child(2){animation-delay:.3s}.card .stars span:nth-child(3){animation-delay:.6s}.card .stars span:nth-child(4){animation-delay:.9s}.card .stars span:nth-child(5){animation-delay:1.2s}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scores div{border-radius:12px;padding:12px;display:grid;gap:2px;min-width:0;overflow-wrap:anywhere}
.scores .A{background:var(--teamA-soft);color:var(--teamA)} .scores .B{background:var(--teamB-soft);color:var(--teamB)}
.scores .money{font-size:1.6rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@keyframes pop{from{transform:scale(.7) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35) rotate(15deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.betrow{grid-template-columns:1fr}}
</style>

<script>
/* Jeder Satz enthält einen modalen Konnektor (indem / dadurch, dass / dadurch / durch) und Wortschatz aus dem Artikel.
   acc = akzeptierte Wörter/Wortgruppen in der Korrektur, bad = Wortgruppen, die nicht mehr vorkommen dürfen. */
const SENTENCES=[
 {s:"Durch ich zuerst meine Vorräte aufbrauche, kaufe ich keine unnötigen Produkte nach.",ok:false,cat:"Konnektor",
  fix:"<mark>Indem</mark> ich zuerst meine Vorräte aufbrauche, kaufe ich keine unnötigen Produkte nach.",
  acc:["indem","dadurch dass"],bad:["durch"],
  why:"„durch“ ist eine Präposition und braucht ein Nomen: durch das Aufbrauchen meiner Vorräte. Vor einem Nebensatz mit dem Verb am Ende steht „indem“ (oder „dadurch, dass“)."},
 {s:"Durch das Ausmisten meines Badezimmerschranks habe ich gesehen, was ich wirklich benutze.",ok:true,cat:"Konnektor",
  why:"„durch“ + Akkusativ: durch das Ausmisten. Nominalisierte Verben sind neutral, deshalb „das“. „ausmisten“ = aussortieren und wegwerfen, was man nicht mehr braucht."},
 {s:"Indem ich keine Werbung mehr anschaue, bin ich nicht mehr so anfällig zu Rabatten.",ok:false,cat:"Wortschatz",
  fix:"Indem ich keine Werbung mehr anschaue, bin ich nicht mehr so anfällig <mark>für Rabatte</mark>.",
  acc:["für"],bad:["zu"],
  why:"Die feste Verbindung heißt „anfällig für + Akkusativ sein“ (≈ sich leicht beeinflussen lassen). Der „indem“-Satz ist korrekt: Das Verb steht am Ende."},
 {s:"Wer kaufsüchtig ist, kann sein Verhalten dadurch ändern dass er sich professionelle Hilfe holt.",ok:false,cat:"Komma",
  fix:"Wer kaufsüchtig ist, kann sein Verhalten dadurch ändern<mark>,</mark> dass er sich professionelle Hilfe holt.",
  re:/,\s*dass|ändern\s*,|^\W*,\W*$|komma/i,
  why:"Der „dass“-Satz ist ein Nebensatz und wird mit Komma abgetrennt. Steht „dadurch“ im Hauptsatz, kommt das Komma direkt vor „dass“: … dadurch ändern, dass … „kaufsüchtig sein“ = einen krankhaften Drang zum Kaufen haben."},
 {s:"Ich habe alle meine Produkte gezählt. Indem wurde mir das Ausmaß meines Konsums klar.",ok:false,cat:"Konnektor",
  fix:"Ich habe alle meine Produkte gezählt. <mark>Dadurch</mark> wurde mir das Ausmaß meines Konsums klar.",
  acc:["dadurch"],bad:["indem"],
  why:"„indem“ leitet nur Nebensätze ein. Zwei Hauptsätze verbindet das Adverb „dadurch“: Es steht auf Position 1, das Verb folgt direkt danach (Dadurch wurde …)."},
 {s:"Durch meinen Kaufstopp habe ich gemerkt, wie viele abgebrochene Packungen in meiner Küche stehen.",ok:false,cat:"Wortschatz",
  fix:"Durch meinen Kaufstopp habe ich gemerkt, wie viele <mark>angebrochene</mark> Packungen in meiner Küche stehen.",
  acc:["angebrochene"],bad:["abgebrochene"],
  why:"„angebrochen“ = schon geöffnet und teilweise verbraucht. „abgebrochen“ heißt: Ein Stück fehlt oder etwas wurde beendet (ein abgebrochener Bleistift, ein abgebrochenes Studium). „Durch meinen Kaufstopp“ ist korrekt: durch + Akkusativ."},
 {s:"Mia hat ein Haushaltsbuch angelegt. Dadurch hat sie ihr Konsumverhalten in den Griff bekommen.",ok:true,cat:"Konnektor",
  why:"„dadurch“ verbindet zwei Hauptsätze, das Verb steht auf Position 2 (Dadurch hat sie …). „etw. in den Griff bekommen“ = etw. unter Kontrolle bringen."},
 {s:"Dadurch, dass Lena alle Produkte fotografiert, sieht sie, wie viel bei ihr angesammelt hat.",ok:false,cat:"Wortschatz",
  fix:"Dadurch, dass Lena alle Produkte fotografiert, sieht sie, wie viel <mark>sich</mark> bei ihr angesammelt hat.",
  acc:["sich"],bad:[],
  why:"„sich ansammeln“ ist reflexiv: Bei ihr hat sich viel angesammelt. Ohne „sich“ ist der Satz unvollständig. Der Konnektor ist korrekt: dadurch, dass + Verb am Ende (fotografiert)."},
 {s:"Indem ich alle Hotelproben und Reisegrößen aufgebraucht habe, habe ich zwei Monate lang kein Duschgel gekauft.",ok:true,cat:"Konnektor",
  why:"Im „indem“-Satz steht das ganze Verb am Ende: aufgebraucht habe. Danach kommt der Hauptsatz mit dem Verb auf Position 1: habe ich …"},
 {s:"Dadurch, dass ich alle Cremes gezählt habe, habe ich mir endlich einen Überblick gemacht.",ok:false,cat:"Wortschatz",
  fix:"Dadurch, dass ich alle Cremes gezählt habe, habe ich mir endlich einen Überblick <mark>verschafft</mark>.",
  acc:["verschafft"],bad:["gemacht"],
  why:"Die Kollokation heißt „sich (Dat.) einen Überblick verschaffen“. „Einen Überblick machen“ sagt man nicht. Der Konnektor ist korrekt: dadurch, dass + Verb am Ende."},
 {s:"Viele Teilnehmende schonen ihren Geldbeutel, indem sie löschen alle Shopping-Apps vom Handy.",ok:false,cat:"Konnektor",
  fix:"Viele Teilnehmende schonen ihren Geldbeutel, indem sie alle Shopping-Apps vom Handy <mark>löschen</mark>.",
  acc:["löschen"],bad:["sie löschen"],
  why:"„indem“ leitet einen Nebensatz ein, deshalb steht das konjugierte Verb am Ende: …, indem sie alle Shopping-Apps vom Handy löschen."},
 {s:"Indem man sich mit Gleichgesinnten austauscht, bleibt man auch nach Wochen motiviert.",ok:true,cat:"Konnektor",
  why:"Korrekt: Verb am Ende (austauscht), danach der Hauptsatz mit dem Verb auf Position 1 (bleibt man). Beide Teilsätze haben dasselbe Subjekt (man)."}
];

const RULES=[
 {kon:"indem",art:"Subjunktion",bau:"Nebensatz, Verb am Ende.",extra:"Subjekt in beiden Teilsätzen meist gleich.",
  bsp:"Ich schone meinen Geldbeutel, <span class=\"k\">indem</span> ich meine Vorräte <span class=\"v\">aufbrauche</span>."},
 {kon:"dadurch, dass",art:"Korrelat + Subjunktion",bau:"Nebensatz, Verb am Ende.",extra:"„dadurch“ steht vorne oder im Hauptsatz, vor „dass“ steht ein Komma. Subjekte dürfen verschieden sein.",
  bsp:"Ich schone meinen Geldbeutel <span class=\"k\">dadurch</span>, <span class=\"k\">dass</span> ich meine Vorräte <span class=\"v\">aufbrauche</span>."},
 {kon:"dadurch",art:"Adverb",bau:"Hauptsatz, Verb auf Position 2.",extra:"Verbindet zwei Hauptsätze.",
  bsp:"Ich brauche meine Vorräte auf. <span class=\"k\">Dadurch</span> <span class=\"v\">schone</span> ich meinen Geldbeutel."},
 {kon:"durch",art:"Präposition + Akk.",bau:"Kein Verb-Nebensatz, sondern ein Nomen.",extra:"Oft ein nominalisiertes Verb: das Aufbrauchen.",

<rect x="2" y="2" width="236" height="124" rx="10" fill="url(#ng)" stroke="#3f7a3a" stroke-width="3"/>
<rect x="10" y="10" width="220" height="108" rx="6" fill="none" stroke="#3f7a3a" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/>
<path d="M120 112 V62 a28 28 0 0 1 56 0 V112" fill="#e4f1dc" stroke="#3f7a3a" stroke-width="2"/>
<path d="M132 112 V66 a16 16 0 0 1 32 0 V112" fill="none" stroke="#3f7a3a" stroke-width="1.5" opacity=".7"/>
<g fill="#f2c94c">${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return `<circle cx="${(205+Math.cos(a)*15).toFixed(1)}" cy="${(36+Math.sin(a)*15).toFixed(1)}" r="2.6"/>`}).join("")}</g>
<text x="18" y="56" font-family="Bebas Neue, Impact, sans-serif" font-size="52" fill="#2d5e2a">100</text>
<text x="18" y="84" font-family="Bebas Neue, Impact, sans-serif" font-size="22" letter-spacing="3" fill="#2d5e2a">EURO</text>
<text x="18" y="108" font-family="JetBrains Mono, monospace" font-size="9" fill="#2d5e2a" opacity=".75">SPIELGELD · PROJECT PAN</text>
<text x="226" y="114" text-anchor="end" font-family="Bebas Neue, Impact, sans-serif" font-size="26" fill="#2d5e2a">100 €</text>
</svg>`;
const START=100, MIN=10;

let S;
function fresh(){return{phase:"rule",teams:[{name:"Team A",money:START},{name:"Team B",money:START}],turn:0,sold:{},lot:null,bet:MIN,choice:null,corr:"",reveal:null,cheat:false}}

const app=document.getElementById("app");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>`${n} €`;
const norm=t=>" "+String(t).toLowerCase().replace(/[^a-zäöüß]+/g," ").trim()+" ";
function checkFix(x,corr){if(x.re) return x.re.test(corr);const n=norm(corr);const has=p=>n.includes(" "+p+" ");return x.acc.some(has)&&!x.bad.some(has)}

function canBet(i){return S.teams[i].money>=MIN}
function openLots(){return SENTENCES.map((_,i)=>i).filter(i=>!(i in S.sold))}
function nextTurn(){
  if(!openLots().length) return end();
  for(let k=1;k<=2;k++){const t=(S.turn+k)%2;if(canBet(t)){S.turn=t;return}}
  end();
}
function end(){S.phase="end"}

function header(){
  return `<header class="masthead"><div class="mh-text"><img class="logo" src="${LOGO}" alt="DeutschPlanet"><p class="eyebrow">Project Pan · Wiederholung B2</p><h1>Satz-Auktion</h1>
  <p class="sub">Zwölf Sätze rund um Project Pan kommen unter den Hammer. Prüfen Sie den Konnektor und den Wortschatz. Setzen Sie Ihr Geld nur auf Sätze, bei denen Sie sicher sind.</p></div>
  <div class="mh-art" aria-hidden="true">${NOTE}<img class="gavel" src="${GAVEL}" alt=""></div></header>`;
}

function ruleTable(){
  return `<table class="rt">
    <thead><tr><th scope="col">Konnektor</th><th scope="col">Satzbau</th><th scope="col">Beispiel</th></tr></thead>
    <tbody>${RULES.map(r=>`<tr>
      <td class="kon">${r.kon}<small>${r.art}</small></td>
      <td class="bau"><strong>${r.bau}</strong>${r.extra}</td>
      <td class="bsp">${r.bsp}</td></tr>`).join("")}</tbody></table>
    <p class="legend"><span><span class="k">Konnektor</span></span><span><span class="v">Verb</span></span><span><span class="n">Nomen nach „durch“</span></span></p>`;
}

function steps(n){
  const L=[["rule","Regel"],["prep","Spielregeln &amp; Sätze"],["play","Auktion"]];
  return `<nav aria-label="Seiten"><ol class="steps">${L.map(([ph,l],i)=>`<li class="${i+1===n?"now":""}"><button type="button" data-step="${ph}"${i+1===n?' aria-current="page"':""}><span class="sn">${i+1}</span>${l}</button></li>`).join("")}</ol></nav>`;
}
function bindSteps(){
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{
    const nA=document.getElementById("nA"),nB=document.getElementById("nB");
    if(nA) S.teams[0].name=nA.value.trim()||"Team A";
    if(nB) S.teams[1].name=nB.value.trim()||"Team B";
    if(S.phase===b.dataset.step) return;
    S.phase=b.dataset.step;render();window.scrollTo({top:0});
  });
}

function renderRule(){
  app.innerHTML=header()+steps(1)+`
  <section class="panel rulecard" aria-labelledby="ruleh">
    <p class="eyebrow">Zuerst die Regel</p>
    <h2 id="ruleh">Wie schone ich meinen Geldbeutel?</h2>
    <p class="lead">Eine Idee, vier Formen. Alle vier nennen das Mittel und antworten auf die Frage <strong>Wie?</strong> oder <strong>Wodurch?</strong></p>
    ${ruleTable()}
  </section>
  <div class="toolbar"><span></span><button class="primary" id="toPrep">Weiter: Spielregeln &amp; Sätze →</button></div>`;
  document.getElementById("toPrep").onclick=()=>{S.phase="prep";render();window.scrollTo({top:0})};
}

function renderPrep(){
  app.innerHTML=header()+steps(2)+`
  <section class="prep">
    <div class="panel">
      <p class="eyebrow">So geht's</p>
      <h2>Spielregeln</h2>
      <ol class="rules">
        <li>Arbeiten Sie in Paaren oder Kleingruppen.</li>
        <li>Lesen Sie die Sätze gemeinsam und entscheiden Sie: richtig oder falsch?</li>
        <li>Achten Sie auf zwei Dinge: den <strong>Konnektor</strong> (indem, dadurch, dadurch dass, durch) und den <strong>Wortschatz</strong> aus dem Artikel.</li>
        <li><strong>Notieren Sie Ihre Ergebnisse geheim</strong>, damit das andere Team sie nicht sieht.</li>
        <li>Ist ein Satz falsch, überlegen Sie gleich die Korrektur.</li>
        <li>Jedes Team startet mit <span class="money">${eur(START)}</span>.</li>
        <li>Die Teams sind abwechselnd an der Reihe, wählen einen Satz und setzen mindestens <span class="money">${eur(MIN)}</span>.</li>
        <li>Richtige Antwort: Das Team gewinnt den Einsatz dazu. Falsche Antwort: Das Team verliert den Einsatz.</li>
      </ol>
    </div>
    <div class="panel">
      <p class="eyebrow">Vorbereitung</p>
      <h2>Die Sätze im Katalog</h2>
      <ul class="preview-list">${SENTENCES.map((x,i)=>`<li><span class="lotno">Los ${i+1}</span><span>${esc(x.s)}</span></li>`).join("")}</ul>
    </div>
  </section>
  <section class="panel startbar" aria-label="Teams">
    <div class="teamfield"><label for="nA"><span class="dot" style="background:var(--teamA)"></span>Name Team 1</label><input type="text" id="nA" value="${esc(S.teams[0].name)}" maxlength="24"></div>
    <div class="teamfield"><label for="nB"><span class="dot" style="background:var(--teamB)"></span>Name Team 2</label><input type="text" id="nB" value="${esc(S.teams[1].name)}" maxlength="24"></div>
    <button class="primary" id="go">Auktion starten →</button>
  </section>
  <div class="toolbar"><button id="toRule">← Zurück zur Regel</button><span></span></div>`;
  document.getElementById("toRule").onclick=()=>{
    S.teams[0].name=document.getElementById("nA").value.trim()||"Team A";
    S.teams[1].name=document.getElementById("nB").value.trim()||"Team B";
    S.phase="rule";render();window.scrollTo({top:0});
  };
  document.getElementById("go").onclick=()=>{
    S.teams[0].name=document.getElementById("nA").value.trim()||"Team A";
    S.teams[1].name=document.getElementById("nB").value.trim()||"Team B";
    S.phase="play";render();window.scrollTo({top:0});
  };
}

function paddles(){
  return `<section class="paddles" aria-label="Kontostand">${S.teams.map((t,i)=>`
    <div class="paddle ${i?"B":"A"} ${S.turn===i?"active":""}">
      <span class="turn">${S.turn===i?"Am Zug":""}</span>
      <span class="name">${esc(t.name)}</span>
      <span class="money">${eur(t.money)}</span>
    </div>`).join("")}</section>`;
}

function cheat(){
  return `<details class="cheat" id="cheat" ${S.cheat?"open":""}><summary>Regel ansehen: indem · dadurch, dass · dadurch · durch</summary>${ruleTable()}</details>`;
}

function renderPlay(){
  const t=S.teams[S.turn];
  let html=header()+steps(3)+paddles();
  if(S.lot===null){
    html+=`<div class="toolbar"><p><strong>${esc(t.name)}</strong> wählt ein Los.</p><button id="stop">Spiel beenden</button></div>
    ${cheat()}
    <section class="lots">${SENTENCES.map((x,i)=>{
      const sd=S.sold[i];
      if(!sd) return `<button class="lot" data-lot="${i}"><span class="lotno">Los ${i+1}</span><span class="s">${esc(x.s)}</span></button>`;
      return `<div class="lot sold"><span class="lotno">Los ${i+1}</span><span class="s">${x.ok?esc(x.s):x.fix}</span>
        <span class="stamp ${sd.win?"win":"lose"}">${esc(S.teams[sd.team].name)} · ${sd.win?"+":"−"}${eur(sd.bet)}</span></div>`;
    }).join("")}</section>`;
  } else html+=desk()+cheat();
  app.innerHTML=html;
  bindPlay();
}

function desk(){
  const x=SENTENCES[S.lot],t=S.teams[S.turn],max=t.money;
  S.bet=Math.min(Math.max(S.bet,MIN),max);
  if(!S.reveal){
    const ready=S.choice==="ok"||(S.choice==="no"&&S.corr.trim().length>0);
    return `<section class="desk" aria-live="polite">
      <p class="eyebrow">Los ${S.lot+1} · Gebot von ${esc(t.name)}</p>
      <p class="bigs">${esc(x.s)}</p>
      <div class="stack">
        <strong>Ihr Einsatz</strong>
        <div class="betrow"><input type="range" id="range" min="${MIN}" max="${max}" step="5" value="${S.bet}" aria-label="Einsatz">
        <input type="number" id="bet" min="${MIN}" max="${max}" value="${S.bet}" aria-label="Einsatz in Euro"></div>
        <div class="row chips">${[10,20,30,50].filter(v=>v<max).map(v=>`<button data-chip="${v}">${eur(v)}</button>`).join("")}<button data-chip="${max}">Alles: ${eur(max)}</button></div>
      </div>
      <div class="stack"><strong>Der Satz ist …</strong>
        <div class="row"><button class="choice yes" id="cOk" aria-pressed="${S.choice==="ok"}">✓ richtig</button>
        <button class="choice no" id="cNo" aria-pressed="${S.choice==="no"}">✗ falsch</button></div>
      </div>
      ${S.choice==="no"?`<div class="stack"><label for="corr"><strong>Ihre Korrektur</strong> <span class="muted small">(ganzer Satz oder nur das korrigierte Wort)</span></label>
        <input type="text" id="corr" value="${esc(S.corr)}" placeholder="z. B. das richtige Wort oder den richtigen Konnektor" autocomplete="off"></div>`:""}
      <div class="toolbar"><button id="back">Anderes Los</button><button class="primary" id="place" ${ready?"":"disabled"}>Gebot abgeben · ${eur(S.bet)}</button></div>
    </section>`;
  }
  const r=S.reveal;
  const tag=x.ok?"Konnektor und Wortschatz stimmen":({Konnektor:"Fehler im Konnektor",Wortschatz:"Fehler im Wortschatz",Komma:"Fehler beim Komma"})[x.cat];
  return `<section class="desk" aria-live="polite">
    <p class="eyebrow">Los ${S.lot+1} · Zuschlag</p>
    <p class="bigs">${esc(x.s)}</p>
    <div class="verdict ${r.win?"win":"lose"}">
      <h3>${r.win?`Richtig! +${eur(S.bet)}`:`Leider falsch. −${eur(S.bet)}`}</h3>
      <p>${esc(t.name)} sagte: <strong>${S.choice==="ok"?"richtig":"falsch"}</strong>${S.choice==="no"?` · Korrektur: „${esc(S.corr)}“`:""}</p>
    </div>
    <div class="stack">
      <p class="eyebrow">Auflösung</p>
      <span class="tag">${tag}</span>
      <p class="solution">${x.ok?`Der Satz ist richtig.`:x.fix}</p>
      <p class="muted">${esc(x.why)}</p>
    </div>
    ${(!x.ok&&S.choice==="no")?`<div class="stack"><p class="small muted">Die Korrektur wurde automatisch geprüft. Die Lehrkraft kann das Ergebnis ändern:</p>
      <div class="row"><button id="accept" aria-pressed="${r.win}">Korrektur gilt</button><button id="reject" aria-pressed="${!r.win}">Korrektur gilt nicht</button></div></div>`:""}
    <div class="toolbar"><span></span><button class="primary" id="next">Weiter</button></div>
  </section>`;
}

function bindPlay(){
  const $=id=>document.getElementById(id);
  document.querySelectorAll("[data-lot]").forEach(b=>b.onclick=()=>{S.lot=+b.dataset.lot;S.bet=MIN;S.choice=null;S.corr="";S.reveal=null;render()});
  if($("cheat")) $("cheat").addEventListener("toggle",e=>{S.cheat=e.target.open});
  if($("stop")) $("stop").onclick=()=>{end();render()};
  if($("back")) $("back").onclick=()=>{S.lot=null;render()};
  const setBet=v=>{const m=S.teams[S.turn].money;S.bet=Math.min(m,Math.max(MIN,Math.round(+v||MIN)));render()};
  if($("range")) $("range").oninput=e=>{S.bet=+e.target.value;$("bet").value=S.bet;$("place").textContent=`Gebot abgeben · ${eur(S.bet)}`};
  if($("bet")) $("bet").onchange=e=>setBet(e.target.value);
  document.querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>setBet(b.dataset.chip));
  if($("cOk")) $("cOk").onclick=()=>{S.choice="ok";render()};
  if($("cNo")) $("cNo").onclick=()=>{S.choice="no";render();$("corr")&&$("corr").focus()};
  if($("corr")) $("corr").oninput=e=>{S.corr=e.target.value;$("place").disabled=!S.corr.trim()};
  if($("place")) $("place").onclick=()=>{
    const x=SENTENCES[S.lot];let win;
    if(S.choice==="ok") win=x.ok;
    else if(x.ok) win=false;
    else win=checkFix(x,S.corr);
    S.reveal={win};render();
  };
  if($("accept")) $("accept").onclick=()=>{S.reveal.win=true;render()};
  if($("reject")) $("reject").onclick=()=>{S.reveal.win=false;render()};
  if($("next")) $("next").onclick=()=>{
    const w=S.reveal.win,t=S.teams[S.turn];
    t.money+=w?S.bet:-S.bet;
    S.sold[S.lot]={team:S.turn,bet:S.bet,win:w};
    S.lot=null;S.reveal=null;S.choice=null;S.corr="";
    nextTurn();render();
  };
}

function renderEnd(){
  const [a,b]=S.teams;
  const lead=a.money===b.money?"Unentschieden – beide Teams sind gleich stark!":`${esc((a.money>b.money?a:b).name)} hat das meiste Geld ersteigert.`;
  app.innerHTML=header()+`<section class="finale">
    <div class="card" role="status">
      <div class="stars" aria-hidden="true"><span>⭐</span><span>🎉</span><span>✨</span><span>🎊</span><span>⭐</span></div>
      <p class="msg">Super gemacht!</p>
      <p>${lead}</p>
      <div class="scores">
        <div class="A"><span>${esc(a.name)}</span><span class="money">${eur(a.money)}</span></div>
        <div class="B"><span>${esc(b.name)}</span><span class="money">${eur(b.money)}</span></div>
      </div>
      <p class="muted small">${Object.keys(S.sold).length} von ${SENTENCES.length} Losen versteigert. Toll gemacht, alle zusammen!</p>
      <button class="primary" id="again">Neue Auktion</button>
    </div></section>`;
  document.getElementById("again").onclick=()=>{S=fresh();stopConfetti();render()};
  confetti();
}

/* confetti */
let raf=null;
function confetti(){
  const c=document.getElementById("confetti");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(raf) cancelAnimationFrame(raf);
  c.hidden=false;const ctx=c.getContext("2d");const dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement);
  const cols=["--brass","--teamA","--teamB"].map(v=>cs.getPropertyValue(v).trim()).concat(["#BF94CC","#FDE4C2","#D3C4E8","#B39DDB","#A04BAF"]);
  const P=Array.from({length:170},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.25,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)],star:Math.random()<.2}));
  const t0=performance.now();
  const star=(x,y,r)=>{ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,rr=i%2?r/2.3:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill()};
  (function f(now){
    ctx.clearRect(0,0,innerWidth,innerHeight);const long=now-t0>6000;let alive=0;
    for(const p of P){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vx+=Math.sin(now/600+p.y/80)*.02;
      if(p.y>innerHeight+20){if(!long){p.y=-20;p.x=Math.random()*innerWidth}else continue}
      alive++;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.star) star(0,0,p.w);else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r)));ctx.restore()}
    raf=alive?requestAnimationFrame(f):(c.hidden=true,null);
  })(t0);
}
function stopConfetti(){if(raf)cancelAnimationFrame(raf);raf=null;document.getElementById("confetti").hidden=true}

function render(){if(S.phase!=="end")stopConfetti();({rule:renderRule,prep:renderPrep,play:renderPlay,end:renderEnd})[S.phase]();bindSteps();}

function start(data){S=data&&data.state&&data.state.teams?data.state:fresh();render()}
window.claude?.hot?.snapshot?.(()=>({state:S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body></html>
